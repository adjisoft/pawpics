name: Cek templat
on:
  push: {branches: [main]}
  pull_request:
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/cek-template.mjs
      - name: Sintaks semua berkas JS
        run: for f in js/*.js js/template/*.js js/template/*/*.js tools/*.mjs; do node --check "$f"; done
